<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>приложение учета Расходов </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>Учет расходов</h1>

  <input 
   class="js-expense-input expense-input"
   type="number">
  <button class="js-expense-button expense-button">Добавить</button>

  <p>Лимит: <span class="js-limit">10000</span> руб.</p>
  <p>Сумма: <span class="js-sum">0</span> руб.</p>
  <p>Статус: <span class="js-status">все хорошо</span></p>

  <h2>История</h2>
  <div class="js-expense-history expense-history">
   
  </div>

  <script src="script.js"></script>  
</body>
</html>
